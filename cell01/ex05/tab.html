<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>
<body>

    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="background-color: rgb(144, 210, 238); height: 150px; border: 1px solid black;">
                First cell
            </td>

            <td style="background-color: lightpink; height: 150px; border: 1px solid black;">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
