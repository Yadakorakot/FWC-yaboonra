<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <h1>User Profile</h1>

        <table>
            <tr>
                <td>
                    <img class="profile" src="profile.jpg" alt="Profile">
                </td>
            </tr>

            <tr>
                <td class="login">
                    Yadakorakot
                </td>
            </tr>

            <tr>
                <td class="description">
                    Cloud Student
                </td>
            </tr>

            <tr>
                <td class="social">
                    <a href="https://github.com/Yadakorakot/FWC-yaboonra.git" target="_blank">
                        <img src="github.png" alt="GitHub">
                    </a>
                    <img src="instagram.png" alt="Instagram">
                    <img src="facebook.png" alt="Facebook">
                </td>
            </tr>

            <tr>
                <td>
                    <button>Contact</button>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
